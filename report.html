<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polar H10 — Inter-Rater Reliability Report</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f8fafc; color: #1a1a2e; padding: 32px 24px; line-height: 1.5; }
        .container { max-width: 1100px; margin: 0 auto; }
        h1 { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
        h2 { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
        h3 { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
        .subtitle { font-size: 13px; color: #6b7280; margin-bottom: 24px; }
        .section { margin-bottom: 32px; scroll-margin-top: 20px; }

        /* Navigation */
        .nav-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 28px; padding: 12px 16px; background: #fff; border-radius: 10px; border: 1px solid #e5e7eb; }
        .nav-btn { padding: 6px 14px; font-size: 12px; font-weight: 500; border-radius: 20px; background: #f3f4f6; color: #374151; text-decoration: none; border: 1px solid #e5e7eb; cursor: pointer; transition: all 0.15s; }
        .nav-btn:hover { background: #e0e7ff; border-color: #a5b4fc; color: #3730a3; }

        /* Hero box */
        .hero-box { border-radius: 16px; padding: 28px 24px 20px; margin-bottom: 24px; border: 2px solid; text-align: center; }
        .hero-box .verdict { font-size: 36px; font-weight: 800; margin-bottom: 4px; }
        .hero-box .kappa-val { font-size: 22px; font-weight: 600; color: #1a1a2e; }
        .hero-box .desc { font-size: 12px; color: #6b7280; margin-top: 6px; }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: #e5e7eb; border-radius: 10px; overflow: hidden; margin-top: 18px; }
        .stat-cell { padding: 14px 10px; background: #fff; text-align: center; }
        .stat-cell .val { font-size: 20px; font-weight: 700; }
        .stat-cell .label { font-size: 11px; color: #6b7280; margin-top: 2px; }

        /* Metric key */
        details.metric-key { margin-bottom: 24px; border: 1px solid #e5e7eb; border-radius: 10px; padding: 12px 16px; background: #fff; }
        details.metric-key summary { font-size: 13px; font-weight: 600; color: #374151; cursor: pointer; }
        details.metric-key .content { margin-top: 12px; font-size: 12px; color: #4b5563; line-height: 1.7; }
        details.metric-key .content strong { color: #1f2937; }
        .band-row { display: flex; gap: 6px; margin: 6px 0 10px; font-size: 11px; }
        .band-chip { padding: 2px 8px; border-radius: 4px; font-weight: 500; }

        /* Tables */
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th { text-align: left; padding: 8px 6px; border-bottom: 1px solid #e5e7eb; background: #f9fafb; font-weight: 600; }
        td { padding: 8px 6px; border-bottom: 1px solid #f3f4f6; }

        /* Collapsible sections */
        details.collapse-section { margin-bottom: 16px; border: 1px solid #e5e7eb; border-radius: 10px; padding: 12px 16px; background: #fff; }
        details.collapse-section summary { font-size: 13px; font-weight: 600; color: #1f2937; cursor: pointer; }

        /* Disagreement row */
        .disag-row { cursor: pointer; background: #fef2f2; }
        .disag-row:hover { background: #fee2e2; }

        /* Chart container */
        .chart-detail { padding: 16px 12px; background: #fafafa; }
    </style>
</head>
<body>
<div class="container">
    <h1>Polar H10 — Inter-Rater Reliability Report</h1>
    <p class="subtitle">Signal quality assessment across 55 studies · Generated from 8 independent reviewers</p>

    <div id="report"></div>
</div>

<script src="data.js"></script>
<script src="trims.js"></script>
<script>
// ============================================================
// CONSTANTS
// ============================================================
const STUDIES = STUDY_DATA;
const irrData = IRR_TRIMS;

const REVIEWER_COLORS = [
    '#2563eb',  // blue (R1)
    '#dc2626',  // red (R2)
    '#059669',  // emerald (R3)
    '#d97706',  // amber (R4)
    '#7c3aed',  // violet (R6)
    '#0284c7',  // sky (R7)
    '#e11d48',  // rose (R8)
    '#0d9488',  // teal (R9)
];

const THEMES = [
    { canonical: 'Multi-device disagreement', description: 'Polar reading inconsistent with WHOOP reference devices',
      patterns: ['multi device', 'multidevice', 'multi-device', 'multidevce', 'inconsistent with', 'other 3 device', 'other devices', 'whoop device', 'discrepancy', 'disgreement', 'disagreement', 'bpm disagree'] },
    { canonical: 'Physiologically implausible', description: 'HR values or changes not biologically realistic',
      patterns: ['physiolog', 'not realistic', 'unprobable', 'not probable', 'unlikely', 'unreliable', 'unrealistic', 'untrustworthy', 'not right'] },
    { canonical: 'Poor signal shape / Stepwise', description: 'Flat lines, staircase pattern, or jagged non-smooth signal',
      patterns: ['stepwise', 'poor plotting', 'plotting shape', 'jumpy', 'flat', 'visual cue', 'staircase'] },
    { canonical: 'Sudden spikes or dropouts', description: 'Dramatic or abrupt HR jumps, drops, or signal loss',
      patterns: ['spike', 'dramatic', 'sudden', 'significant drop', 'significant raise', 'significant hr', 'dropout', 'drop out', 'drops out', 'sramatic', 'anecdot', 'end of study'] },
    { canonical: 'Delayed or missed HR response', description: 'Polar fails to track expected HR changes seen on other devices',
      patterns: ['delay', 'not following', 'not catching', 'missed', 'stays low', 'not caught', 'not track', 'low confidence'] },
];

// ============================================================
// HELPERS
// ============================================================
function heroTab(view) {
    const data = window._heroData;
    if (!data) return;
    const d = data[view];
    document.getElementById('hero_subtitle').textContent = d.subtitle;
    document.getElementById('hero_grade').textContent = d.grade;
    document.getElementById('hero_grade').style.color = d.color;
    document.getElementById('hero_metric_label').textContent = d.label;
    document.getElementById('hero_metric_value').textContent = d.value;
    document.getElementById('hero_metric_value').style.color = d.color;
    ['balanced', 'consensus', 'majority'].forEach(v => {
        const el = document.getElementById('hero_view_' + v);
        el.style.display = v === view ? (v === 'balanced' ? 'grid' : '') : 'none';
        const tab = document.getElementById('hero_tab_' + v);
        tab.style.background = v === view ? '#fff' : 'transparent';
        tab.style.color = v === view ? '#374151' : '#6b7280';
    });
}

function thresholdTab(view) {
    ['balanced', 'consensus', 'majority'].forEach(v => {
        const el = document.getElementById('thresh_view_' + v);
        el.style.display = v === view ? 'grid' : 'none';
        const tab = document.getElementById('thresh_tab_' + v);
        tab.style.background = v === view ? '#fff' : 'transparent';
        tab.style.color = v === view ? '#374151' : '#6b7280';
    });
}

function formatSeconds(s) {
    const m = Math.floor(s / 60);
    const sec = Math.round(s % 60);
    return m > 0 ? `${m}m ${sec}s` : `${sec}s`;
}

function getAgreementBand(val) {
    if (val >= 0.95) return { label: 'A+', color: '#15803d' };
    if (val >= 0.90) return { label: 'A', color: '#16a34a' };
    if (val >= 0.85) return { label: 'A-', color: '#22c55e' };
    if (val >= 0.80) return { label: 'B+', color: '#65a30d' };
    if (val >= 0.75) return { label: 'B', color: '#ca8a04' };
    if (val >= 0.70) return { label: 'B-', color: '#eab308' };
    if (val >= 0.65) return { label: 'C+', color: '#f59e0b' };
    if (val >= 0.60) return { label: 'C', color: '#f97316' };
    if (val >= 0.55) return { label: 'C-', color: '#ea580c' };
    if (val >= 0.50) return { label: 'D+', color: '#dc2626' };
    if (val >= 0.45) return { label: 'D', color: '#b91c1c' };
    if (val >= 0.40) return { label: 'D-', color: '#991b1b' };
    return { label: 'F', color: '#7f1d1d' };
}

function getSecondBins(trims, study) {
    const startMs = new Date(study.polar.ts[0]).getTime();
    const endMs = new Date(study.polar.ts[study.polar.ts.length - 1]).getTime();
    const duration = Math.ceil((endMs - startMs) / 1000);
    const bins = new Array(duration).fill(0);
    (trims || []).forEach(t => {
        const s = Math.max(0, Math.floor((new Date(t.start).getTime() - startMs) / 1000));
        const e = Math.min(duration, Math.ceil((new Date(t.end).getTime() - startMs) / 1000));
        for (let i = s; i < e; i++) bins[i] = 1;
    });
    return bins;
}

// ============================================================
// COMPUTE AND RENDER
// ============================================================
function computeReport() {
    const reviewers = Object.keys(irrData);
    const studyIds = Object.keys(STUDIES);
    const container = document.getElementById('report');

    // Per-study metrics
    const studyMetrics = [];
    let totalIntersection = 0, totalUnion = 0;
    const pairResults = [];
    const reviewerStats = reviewers.map(() => ({ flaggedSec: 0, regionCount: 0, totalSec: 0 }));

    studyIds.forEach(sid => {
        const study = STUDIES[sid];
        const startMs = new Date(study.polar.ts[0]).getTime();
        const endMs = new Date(study.polar.ts[study.polar.ts.length - 1]).getTime();
        const duration = Math.ceil((endMs - startMs) / 1000);
        const allBins = reviewers.map((r, ri) => {
            const trims = irrData[r][sid] || [];
            reviewerStats[ri].regionCount += trims.length;
            reviewerStats[ri].totalSec += duration;
            const bins = getSecondBins(trims, study);
            const flagged = bins.reduce((s, v) => s + v, 0);
            reviewerStats[ri].flaggedSec += flagged;
            return bins;
        });

        let sInt = 0, sUni = 0;
        for (let i = 0; i < duration; i++) {
            const anyFlagged = allBins.some(b => b[i]);
            const allFlagged = allBins.every(b => b[i]);
            if (anyFlagged) sUni++;
            if (allFlagged) sInt++;
        }
        const studyIoU = sUni > 0 ? sInt / sUni : (allBins.every(b => b.reduce((s,v)=>s+v,0) === 0) ? 1 : 0);
        const avgFlagged = allBins.reduce((s, b) => s + b.reduce((ss, v) => ss + v, 0), 0) / reviewers.length;
        const flaggedPct = duration > 0 ? (avgFlagged / duration) * 100 : 0;
        const regionsPerReviewer = reviewers.map(r => (irrData[r][sid] || []).length);

        studyMetrics.push({ sid, campaign: study.campaign || '—', duration, studyIoU, flaggedPct, regionsPerReviewer, allBins, startMs, endMs });
    });

    // Global pairwise IoU
    for (let a = 0; a < reviewers.length; a++) {
        for (let b = a + 1; b < reviewers.length; b++) {
            let pairInt = 0, pairUni = 0;
            studyIds.forEach(sid => {
                const study = STUDIES[sid];
                const binsA = getSecondBins(irrData[reviewers[a]][sid], study);
                const binsB = getSecondBins(irrData[reviewers[b]][sid], study);
                for (let i = 0; i < binsA.length; i++) {
                    if (binsA[i] || binsB[i]) { pairUni++; totalUnion++; }
                    if (binsA[i] && binsB[i]) { pairInt++; totalIntersection++; }
                }
            });
            pairResults.push({ a: reviewers[a], b: reviewers[b], iou: pairUni > 0 ? pairInt / pairUni : 1 });
        }
    }

    // Fleiss' Kappa
    let totalN = 0, sumP = 0;
    const categoryTotals = [0, 0];
    studyIds.forEach(sid => {
        const study = STUDIES[sid];
        const allBins = reviewers.map(r => getSecondBins(irrData[r][sid], study));
        const duration = allBins[0].length;
        const nR = reviewers.length;
        for (let i = 0; i < duration; i++) {
            const bad = allBins.reduce((s, b) => s + b[i], 0);
            const notBad = nR - bad;
            categoryTotals[0] += notBad;
            categoryTotals[1] += bad;
            sumP += (bad * (bad - 1) + notBad * (notBad - 1));
            totalN++;
        }
    });
    const nR = reviewers.length;
    const Pbar = totalN > 0 ? sumP / (totalN * nR * (nR - 1)) : 0;
    const totalRatings = totalN * nR;
    const Pe = Math.pow(categoryTotals[0] / totalRatings, 2) + Math.pow(categoryTotals[1] / totalRatings, 2);
    const kappa = Pe < 1 ? (Pbar - Pe) / (1 - Pe) : 1;
    const overallIoU = totalUnion > 0 ? totalIntersection / totalUnion : 0;
    const kappaBand = getAgreementBand(kappa);
    const iouBand = getAgreementBand(overallIoU);

    // Boundary-tolerant IoU
    const TOLERANCE = 5;
    let tolInt = 0, tolUni = 0;
    for (let a = 0; a < reviewers.length; a++) {
        for (let b = a + 1; b < reviewers.length; b++) {
            studyIds.forEach(sid => {
                const study = STUDIES[sid];
                const binsA = getSecondBins(irrData[reviewers[a]][sid], study);
                const binsB = getSecondBins(irrData[reviewers[b]][sid], study);
                const dilA = new Array(binsA.length).fill(0);
                const dilB = new Array(binsB.length).fill(0);
                for (let i = 0; i < binsA.length; i++) {
                    if (binsA[i]) for (let d = Math.max(0, i - TOLERANCE); d < Math.min(binsA.length, i + TOLERANCE + 1); d++) dilA[d] = 1;
                    if (binsB[i]) for (let d = Math.max(0, i - TOLERANCE); d < Math.min(binsB.length, i + TOLERANCE + 1); d++) dilB[d] = 1;
                }
                for (let i = 0; i < dilA.length; i++) {
                    if (dilA[i] || dilB[i]) tolUni++;
                    if (dilA[i] && dilB[i]) tolInt++;
                }
            });
        }
    }
    const tolerantIoU = tolUni > 0 ? tolInt / tolUni : 0;

    // Per-campaign Kappa
    const campaignGroups = {};
    studyIds.forEach(sid => {
        const camp = STUDIES[sid].campaign || 'Unknown';
        if (!campaignGroups[camp]) campaignGroups[camp] = [];
        campaignGroups[camp].push(sid);
    });
    const campaignKappas = Object.entries(campaignGroups).map(([camp, sids]) => {
        let cTotalN = 0, cSumP = 0;
        const cCatTotals = [0, 0];
        sids.forEach(sid => {
            const study = STUDIES[sid];
            const allB = reviewers.map(r => getSecondBins(irrData[r][sid], study));
            const dur = allB[0].length;
            for (let i = 0; i < dur; i++) {
                const bad = allB.reduce((s, b) => s + b[i], 0);
                const notBad = nR - bad;
                cCatTotals[0] += notBad;
                cCatTotals[1] += bad;
                cSumP += (bad * (bad - 1) + notBad * (notBad - 1));
                cTotalN++;
            }
        });
        const cPbar = cTotalN > 0 ? cSumP / (cTotalN * nR * (nR - 1)) : 0;
        const cTotalRatings = cTotalN * nR;
        const cPe = Math.pow(cCatTotals[0] / cTotalRatings, 2) + Math.pow(cCatTotals[1] / cTotalRatings, 2);
        const cKappa = cPe < 1 ? (cPbar - cPe) / (1 - cPe) : 1;
        return { campaign: camp, studies: sids.length, kappa: cKappa };
    }).sort((a, b) => b.kappa - a.kappa);

    // Disagreement spotlight
    const disagreements = studyMetrics
        .filter(sm => !sm.allBins.every(b => b.reduce((s,v)=>s+v,0) === 0))
        .sort((a, b) => a.studyIoU - b.studyIoU)
        .slice(0, 5);

    // Reviewer stats
    const avgFlagRate = reviewerStats.reduce((s, r) => s + (r.totalSec > 0 ? r.flaggedSec / r.totalSec : 0), 0) / reviewers.length;
    const totalRegions = reviewerStats.reduce((s, r) => s + r.regionCount, 0);

    // Reasons/themes
    const allNotes = [];
    const overlappingRegions = [];
    studyIds.forEach(sid => {
        const study = STUDIES[sid];
        const startMs = new Date(study.polar.ts[0]).getTime();
        const duration = Math.ceil((new Date(study.polar.ts[study.polar.ts.length - 1]).getTime() - startMs) / 1000);
        const allTrims = [];
        reviewers.forEach(r => {
            (irrData[r][sid] || []).forEach(t => {
                const note = (t.note || t.reason || '').trim();
                if (note) allNotes.push(note);
                allTrims.push({ reviewer: r, start: Math.max(0, (new Date(t.start).getTime() - startMs) / 1000), end: Math.min(duration, (new Date(t.end).getTime() - startMs) / 1000), note });
            });
        });
        for (let i = 0; i < allTrims.length; i++) {
            const cluster = [allTrims[i]];
            for (let j = i + 1; j < allTrims.length; j++) {
                if (allTrims[j].reviewer === allTrims[i].reviewer) continue;
                if (allTrims[j].start < allTrims[i].end && allTrims[j].end > allTrims[i].start) {
                    if (!cluster.find(c => c.reviewer === allTrims[j].reviewer)) cluster.push(allTrims[j]);
                }
            }
            if (cluster.length >= 2 && cluster.some(c => c.note)) {
                const key = sid + '_' + Math.round(cluster[0].start);
                if (!overlappingRegions.find(o => o.key === key)) {
                    overlappingRegions.push({ key, sid, cluster, startSec: Math.min(...cluster.map(c=>c.start)), endSec: Math.max(...cluster.map(c=>c.end)) });
                }
            }
        }
    });

    const noteFreq = {};
    allNotes.forEach(n => { const lower = n.toLowerCase(); noteFreq[lower] = (noteFreq[lower] || { text: n, count: 0 }); noteFreq[lower].count++; });
    const sortedNotes = Object.values(noteFreq).sort((a, b) => b.count - a.count);

    const themeCounts = THEMES.map(t => ({ ...t, count: 0, reviewerCounts: {} }));
    allNotes.forEach(n => { const lower = n.toLowerCase(); themeCounts.forEach(t => { if (t.patterns.some(p => lower.includes(p))) t.count++; }); });
    reviewers.forEach(r => {
        const rNotes = [];
        studyIds.forEach(sid => { (irrData[r][sid] || []).forEach(t => { const note = (t.note || t.reason || '').trim(); if (note) rNotes.push(note.toLowerCase()); }); });
        themeCounts.forEach(tc => { tc.reviewerCounts[r] = rNotes.filter(n => tc.patterns.some(p => n.includes(p))).length; });
    });
    const activeThemes = themeCounts.filter(t => t.count > 0).sort((a, b) => b.count - a.count);

    // ================================================================
    // EVENT-LEVEL THRESHOLD AGREEMENT (lead metric)
    // ================================================================
    const GAP_TOL = 15;
    const allEvents = [];
    studyIds.forEach(sid => {
        const study = STUDIES[sid];
        const startMs2 = new Date(study.polar.ts[0]).getTime();
        const dur2 = Math.ceil((new Date(study.polar.ts[study.polar.ts.length-1]).getTime() - startMs2) / 1000);
        const intervals = [];
        reviewers.forEach(r => {
            (irrData[r][sid] || []).forEach(t => {
                const s = Math.max(0, (new Date(t.start).getTime() - startMs2) / 1000);
                const e = Math.min(dur2, (new Date(t.end).getTime() - startMs2) / 1000);
                if (e > s) intervals.push([s, e]);
            });
        });
        if (intervals.length === 0) return;
        intervals.sort((a, b) => a[0] - b[0]);
        const merged2 = [[intervals[0][0], intervals[0][1]]];
        for (let i = 1; i < intervals.length; i++) {
            if (intervals[i][0] <= merged2[merged2.length-1][1] + GAP_TOL) {
                merged2[merged2.length-1][1] = Math.max(merged2[merged2.length-1][1], intervals[i][1]);
            } else {
                merged2.push([intervals[i][0], intervals[i][1]]);
            }
        }
        merged2.forEach(([es, ee]) => {
            const flags = reviewers.map(r => {
                return (irrData[r][sid] || []).some(t => {
                    const ts = Math.max(0, (new Date(t.start).getTime() - startMs2) / 1000);
                    const te = Math.min(dur2, (new Date(t.end).getTime() - startMs2) / 1000);
                    return ts < ee && te > es;
                });
            });
            allEvents.push({ sid, start: es, end: ee, duration: ee - es, nFlagged: flags.filter(Boolean).length, flags });
        });
    });
    let evtPairsTotal = 0, evtPairsAgree = 0;
    allEvents.forEach(e => {
        for (let a = 0; a < reviewers.length; a++) {
            for (let b = a + 1; b < reviewers.length; b++) {
                evtPairsTotal++;
                if (e.flags[a] === e.flags[b]) evtPairsAgree++;
            }
        }
    });
    const thresholdAgreement = evtPairsTotal > 0 ? evtPairsAgree / evtPairsTotal : 0;
    const thresholdBand = getAgreementBand(thresholdAgreement);
    const consensusRate = allEvents.length > 0 ? allEvents.filter(e => e.nFlagged >= 5).length / allEvents.length : 0;
    const consensusBand = getAgreementBand(consensusRate);
    const majorityRate = allEvents.length > 0 ? allEvents.filter(e => e.nFlagged >= 4).length / allEvents.length : 0;
    const majorityBand = getAgreementBand(majorityRate);

    window._heroData = {
        balanced: { subtitle: 'Pairwise Threshold Agreement', label: 'Agreement', value: (thresholdAgreement * 100).toFixed(1) + '%', grade: thresholdBand.label, color: thresholdBand.color },
        consensus: { subtitle: 'Consensus Rate (5+ of 7 flag)', label: 'Consensus', value: (consensusRate * 100).toFixed(1) + '%', grade: consensusBand.label, color: consensusBand.color },
        majority: { subtitle: 'Majority Rule (4+ of 7 flag)', label: 'Trim Rate', value: (majorityRate * 100).toFixed(1) + '%', grade: majorityBand.label, color: majorityBand.color }
    };

    // ================================================================
    // BUILD HTML
    // ================================================================
    let html = '';

    // --- NAVIGATION ---
    html += `<nav class="nav-bar">
        <a class="nav-btn" href="#spotlight">Disagreement Spotlight</a>
        <a class="nav-btn" href="#themes">Reasons Analysis</a>
        <a class="nav-btn" href="#per-study">Per-Study Breakdown</a>
        <a class="nav-btn" href="#pairwise">Pairwise Agreement</a>
        <a class="nav-btn" href="#reviewers">Reviewer Comparison</a>
        <a class="nav-btn" href="#analysis">Final Analysis</a>
    </nav>`;

    // --- HERO BOX (puzzle layout: verdict left, metric top-right, tabbed stats bottom) ---
    html += `<div id="hero_box" style="border:2px solid ${thresholdBand.color}44; border-radius:12px; background:linear-gradient(135deg, ${thresholdBand.color}06, ${thresholdBand.color}12); overflow:hidden; margin-bottom:24px;">
        <div style="display:grid; grid-template-columns:1fr auto; gap:1px; background:${thresholdBand.color}20;">
            <div style="background:linear-gradient(135deg, ${thresholdBand.color}04, ${thresholdBand.color}10); padding:14px 20px; display:flex; flex-direction:column; justify-content:center;">
                <div id="hero_subtitle" style="font-size:11px; font-weight:500; color:#6b7280;">Pairwise Threshold Agreement</div>
                <div id="hero_grade" style="font-size:22px; font-weight:800; color:${thresholdBand.color}; margin:2px 0;">${thresholdBand.label}</div>
                <div id="hero_desc" style="font-size:11px; color:#6b7280;">${reviewers.length} reviewers, ${studyIds.length} studies, ${allEvents.length} signal events</div>
            </div>
            <div style="background:#fff; padding:14px 24px; display:flex; flex-direction:column; align-items:center; justify-content:center; min-width:100px;">
                <div id="hero_metric_label" style="font-size:10px; font-weight:500; color:#6b7280; text-transform:uppercase; letter-spacing:0.5px;">Agreement</div>

    html += `<details class="metric-key">

            <p style="margin-top:8px;"><strong>Event Classification:</strong> "High" = 6-7 of 7 reviewers flag (unambiguous trim). "Moderate" = 4-5 flag (majority but notable dissent). "Low" = 2-3 flag (calibration target). "Solo" = 1 reviewer flags.</p>
            <p style="margin-top:8px;"><strong>Fleiss' Kappa (κ = ${kappa.toFixed(3)})</strong> is included for reference. It applies a chance correction which assumes some agreement is random — this penalizes agreement on clean signal (which is correct observation, not luck). For this reason, the threshold agreement is the primary metric.</p>

            <p><strong>Strict IoU (Intersection over Union)</strong> measures how much the flagged time regions physically overlap across all reviewer pairs. Intersection = seconds flagged by both; Union = seconds flagged by either. 100% means all reviewers flagged exactly the same time windows; 0% means no overlap at all.</p>
            <p style="margin-top:8px;"><strong>Tolerant IoU (±5s)</strong> applies a 5-second boundary dilation before computing overlap. This accounts for the inherent imprecision of manually selecting trim boundaries — two reviewers may identify the same bad region but disagree on the exact start/end by a few seconds. The tolerance captures "same intent, slightly different boundaries."</p>

        <div style="background:#fff; border:1px solid #e5e7eb; border-radius:12px; padding:20px; margin-bottom:16px;">
            <h3 style="color:#1f2937; margin-bottom:10px;">Boundary Precision Analysis</h3>
            <p style="font-size:13px; color:#374151; line-height:1.7; margin-bottom:12px;">
                The ±5s tolerant IoU (${(tolerantIoU * 100).toFixed(1)}%) improves over strict IoU (${(overallIoU * 100).toFixed(1)}%) by only <strong>${(tolerantIoU * 100 - overallIoU * 100).toFixed(2)} percentage points</strong>. This near-zero gap reveals a critical insight about the nature of reviewer disagreement:
            </p>
            ${(() => {
                // Compute trim duration distribution
                const allDurs = [];
                reviewers.forEach(r => {
                    studyIds.forEach(sid => {
                        (irrData[r][sid] || []).forEach(t => {
                            allDurs.push((new Date(t.end).getTime() - new Date(t.start).getTime()) / 1000);
                        });
                    });
                });
                allDurs.sort((a, b) => a - b);
                const n = allDurs.length;
                const median = allDurs[Math.floor(n/2)];
                const p25 = allDurs[Math.floor(n*0.25)];
                const p75 = allDurs[Math.floor(n*0.75)];
                const shortTrims = allDurs.filter(d => d < 10).length;
                const longTrims = allDurs.filter(d => d > 120).length;
                
                // Per-study tolerance gain
                const studyGains = studyMetrics.map(sm => {
                    let sStrict = 0, sStrictUni = 0, sTol = 0, sTolUni = 0;
                    for (let a = 0; a < reviewers.length; a++) {
                        for (let b = a + 1; b < reviewers.length; b++) {
                            const bA = getSecondBins(irrData[reviewers[a]][sm.sid], STUDIES[sm.sid]);
                            const bB = getSecondBins(irrData[reviewers[b]][sm.sid], STUDIES[sm.sid]);
                            const L = Math.min(bA.length, bB.length);
                            const dA = new Array(L).fill(0), dB = new Array(L).fill(0);
                            for (let i = 0; i < L; i++) {
                                if (bA[i] || bB[i]) sStrictUni++;
                                if (bA[i] && bB[i]) sStrict++;
                                if (bA[i]) for (let d = Math.max(0,i-5); d < Math.min(L,i+6); d++) dA[d]=1;
                                if (bB[i]) for (let d = Math.max(0,i-5); d < Math.min(L,i+6); d++) dB[d]=1;
                            }
                            for (let i = 0; i < L; i++) {
                                if (dA[i] || dB[i]) sTolUni++;
                                if (dA[i] && dB[i]) sTol++;
                            }
                        }
                    }
                    const strict = sStrictUni > 0 ? sStrict/sStrictUni : 1;
                    const tol = sTolUni > 0 ? sTol/sTolUni : 1;
                    return { sid: sm.sid, gain: (tol - strict) * 100 };
                }).filter(g => g.gain > 0).sort((a,b) => b.gain - a.gain);
                
                const gainsUnder1 = studyGains.filter(g => g.gain < 1).length + (studyMetrics.length - studyGains.length);
                
                return `<ul style="font-size:13px; line-height:1.8; padding-left:20px; color:#374151;">
                    <li><strong>Why tolerance barely helps:</strong> The median trim duration is <strong>${Math.round(median)}s</strong> (~${(median/60).toFixed(1)} min). When flagged regions are this long, a ±5s boundary expansion adds negligible area to the union.</li>
                    <li><strong>Trim duration distribution:</strong> P25 = ${Math.round(p25)}s, Median = ${Math.round(median)}s, P75 = ${Math.round(p75)}s. Only ${shortTrims} of ${n} trims (${(shortTrims/n*100).toFixed(1)}%) are under 10s where tolerance would meaningfully help.</li>
                    <li><strong>${longTrims} of ${n} trims (${(longTrims/n*100).toFixed(1)}%)</strong> are over 2 minutes — these are large contiguous bad-signal regions where boundary precision is irrelevant.</li>
                    <li><strong>${gainsUnder1} of ${studyIds.length} studies</strong> gained less than 1 percentage point from the tolerance window.</li>
                    <li><strong>Interpretation:</strong> Disagreement is almost entirely about <em>whether</em> to flag a region, not <em>where</em> boundaries fall. When reviewers agree something is bad signal, they mark essentially the same time window. The challenge is calibrating the <em>threshold</em> for what qualifies as bad signal.</li>
                    <li><strong>Implication for protocol:</strong> Boundary guidance (e.g., "start/end within ±5s") is already well-understood. Future calibration efforts should focus on exemplar studies that define the <em>severity threshold</em> — what level of artifact warrants flagging.</li>
                </ul>`;
            })()}
        </div>

        <div style="background:#fff; border:1px solid #e5e7eb; border-radius:12px; padding:20px; margin-bottom:16px;">
            <h3 style="color:#1f2937; margin-bottom:10px;">Threshold Agreement Analysis</h3>
            <p style="font-size:13px; color:#374151; line-height:1.7; margin-bottom:12px;">
                Since boundary precision is not the source of disagreement, this analysis isolates the core question: <strong>do reviewers agree on <em>whether</em> a signal event should be trimmed?</strong> All reviewer trims are merged into distinct signal events (15s gap tolerance), then each event is classified by how many reviewers flagged any part of it.
            </p>
            ${(() => {
                // Identify events by merging all trims with 15s gap tolerance
                const GAP_TOL = 15;
                const allEvents = [];
                studyIds.forEach(sid => {
                    const study = STUDIES[sid];
                    const startMs = new Date(study.polar.ts[0]).getTime();
                    const dur = Math.ceil((new Date(study.polar.ts[study.polar.ts.length-1]).getTime() - startMs) / 1000);
                    const intervals = [];
                    reviewers.forEach(r => {
                        (irrData[r][sid] || []).forEach(t => {
                            const s = Math.max(0, (new Date(t.start).getTime() - startMs) / 1000);
                            const e = Math.min(dur, (new Date(t.end).getTime() - startMs) / 1000);
                            if (e > s) intervals.push([s, e]);
                        });
                    });
                    if (intervals.length === 0) return;
                    intervals.sort((a, b) => a[0] - b[0]);
                    const merged = [[intervals[0][0], intervals[0][1]]];
                    for (let i = 1; i < intervals.length; i++) {
                        if (intervals[i][0] <= merged[merged.length-1][1] + GAP_TOL) {
                            merged[merged.length-1][1] = Math.max(merged[merged.length-1][1], intervals[i][1]);
                        } else {
                            merged.push([intervals[i][0], intervals[i][1]]);
                        }
                    }
                    merged.forEach(([es, ee]) => {
                        const flags = reviewers.map(r => {
                            return (irrData[r][sid] || []).some(t => {
                                const ts = Math.max(0, (new Date(t.start).getTime() - startMs) / 1000);
                                const te = Math.min(dur, (new Date(t.end).getTime() - startMs) / 1000);
                                return ts < ee && te > es;
                            });
                        });
                        allEvents.push({ sid, start: es, end: ee, duration: ee - es, nFlagged: flags.filter(Boolean).length, flags });
                    });
                });

                const high = allEvents.filter(e => e.nFlagged >= 6);
                const moderate = allEvents.filter(e => e.nFlagged >= 4 && e.nFlagged <= 5);
                const low = allEvents.filter(e => e.nFlagged >= 2 && e.nFlagged <= 3);
                const solo = allEvents.filter(e => e.nFlagged === 1);
                const totalEvt = allEvents.length;
                const totalTime = allEvents.reduce((s, e) => s + e.duration, 0);

                // Pairwise threshold agreement
                let totalPairs = 0, agreeingPairs = 0;
                allEvents.forEach(e => {
                    for (let a = 0; a < reviewers.length; a++) {
                        for (let b = a+1; b < reviewers.length; b++) {
                            totalPairs++;
                            if (e.flags[a] === e.flags[b]) agreeingPairs++;
                        }
                    }
                });
                const pairwiseAgreement = (agreeingPairs / totalPairs * 100).toFixed(1);

                // Per-reviewer: how often they flag in solo/low bucket
                const reviewerMinority = reviewers.map((r, ri) => {
                    const flagged = allEvents.filter(e => e.flags[ri]);
                    const inLow = flagged.filter(e => e.nFlagged <= 3);
                    return { name: r, total: flagged.length, minority: inLow.length, rate: flagged.length > 0 ? (inLow.length / flagged.length * 100).toFixed(0) : '0' };
                });

                // Low/moderate zone events (top by duration) — calibration targets
                const calibrationTargets = [...low, ...moderate].sort((a, b) => b.duration - a.duration).slice(0, 10);

                return `
                <div style="display:flex; gap:0; background:#f3f4f6; padding:4px 4px 0; border-radius:8px 8px 0 0; margin-bottom:0;">
                    <button onclick="thresholdTab('balanced')" id="thresh_tab_balanced" style="flex:1; padding:6px 8px; font-size:11px; font-weight:600; border:none; cursor:pointer; border-radius:6px 6px 0 0; background:#fff; color:#374151;">Balanced</button>
                    <button onclick="thresholdTab('consensus')" id="thresh_tab_consensus" style="flex:1; padding:6px 8px; font-size:11px; font-weight:600; border:none; cursor:pointer; border-radius:6px 6px 0 0; background:transparent; color:#6b7280;">Consensus</button>
                    <button onclick="thresholdTab('majority')" id="thresh_tab_majority" style="flex:1; padding:6px 8px; font-size:11px; font-weight:600; border:none; cursor:pointer; border-radius:6px 6px 0 0; background:transparent; color:#6b7280;">Majority Rule</button>
                </div>
                <div id="thresh_view_balanced" style="display:grid; grid-template-columns:repeat(4, 1fr); gap:12px; margin-bottom:16px; padding-top:12px;">
                    <div style="text-align:center; padding:14px; background:#fef2f2; border-radius:8px;">
                        <div style="font-size:20px; font-weight:800; color:#dc2626;">${solo.length}</div>
                        <div style="font-size:11px; color:#dc2626; font-weight:600;">Solo</div>
                        <div style="font-size:10px; color:#6b7280;">1 of 7</div>
                        <div style="font-size:10px; color:#6b7280;">${(solo.reduce((s,e)=>s+e.duration,0)/60).toFixed(0)} min</div>
                    </div>
                    <div style="text-align:center; padding:14px; background:#fefce8; border-radius:8px;">
                        <div style="font-size:20px; font-weight:800; color:#ca8a04;">${low.length}</div>
                        <div style="font-size:11px; color:#ca8a04; font-weight:600;">Low</div>
                        <div style="font-size:10px; color:#6b7280;">2-3 of 7</div>
                        <div style="font-size:10px; color:#6b7280;">${(low.reduce((s,e)=>s+e.duration,0)/60).toFixed(0)} min</div>
                    </div>
                    <div style="text-align:center; padding:14px; background:#f7fee7; border-radius:8px;">
                        <div style="font-size:20px; font-weight:800; color:#65a30d;">${moderate.length}</div>
                        <div style="font-size:11px; color:#65a30d; font-weight:600;">Moderate</div>
                        <div style="font-size:10px; color:#6b7280;">4-5 of 7</div>
                        <div style="font-size:10px; color:#6b7280;">${(moderate.reduce((s,e)=>s+e.duration,0)/60).toFixed(0)} min</div>
                    </div>
                    <div style="text-align:center; padding:14px; background:#ecfdf5; border-radius:8px;">
                        <div style="font-size:20px; font-weight:800; color:#15803d;">${high.length}</div>
                        <div style="font-size:11px; color:#15803d; font-weight:600;">High</div>
                        <div style="font-size:10px; color:#6b7280;">6-7 of 7</div>
                        <div style="font-size:10px; color:#6b7280;">${(high.reduce((s,e)=>s+e.duration,0)/60).toFixed(0)} min</div>
                    </div>
                </div>
                <div id="thresh_view_consensus" style="display:none; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px; padding-top:12px;">
                    <div style="text-align:center; padding:16px; background:#ecfdf5; border-radius:8px;">
                        <div style="font-size:24px; font-weight:800; color:#15803d;">${allEvents.filter(e => e.nFlagged >= 5).length}</div>
                        <div style="font-size:12px; color:#15803d; font-weight:600;">Consensus (5+)</div>
                        <div style="font-size:11px; color:#6b7280;">${(allEvents.filter(e => e.nFlagged >= 5).reduce((s,e)=>s+e.duration,0)/60).toFixed(0)} min</div>
                    </div>
                    <div style="text-align:center; padding:16px; background:#fef2f2; border-radius:8px;">
                        <div style="font-size:24px; font-weight:800; color:#dc2626;">${allEvents.filter(e => e.nFlagged <= 4).length}</div>
                        <div style="font-size:12px; color:#dc2626; font-weight:600;">Non-consensus (1-4)</div>
                        <div style="font-size:11px; color:#6b7280;">${(allEvents.filter(e => e.nFlagged <= 4).reduce((s,e)=>s+e.duration,0)/60).toFixed(0)} min</div>
                    </div>
                </div>
                <div id="thresh_view_majority" style="display:none; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px; padding-top:12px;">
                    <div style="text-align:center; padding:16px; background:#ecfdf5; border-radius:8px;">
                        <div style="font-size:24px; font-weight:800; color:#15803d;">${allEvents.filter(e => e.nFlagged >= 4).length}</div>
                        <div style="font-size:12px; color:#15803d; font-weight:600;">Trim (4+)</div>
                        <div style="font-size:11px; color:#6b7280;">${(allEvents.filter(e => e.nFlagged >= 4).reduce((s,e)=>s+e.duration,0)/60).toFixed(0)} min</div>
                    </div>
                    <div style="text-align:center; padding:16px; background:#fef2f2; border-radius:8px;">
                        <div style="font-size:24px; font-weight:800; color:#dc2626;">${allEvents.filter(e => e.nFlagged <= 3).length}</div>
                        <div style="font-size:12px; color:#dc2626; font-weight:600;">No Trim (1-3)</div>
                        <div style="font-size:11px; color:#6b7280;">${(allEvents.filter(e => e.nFlagged <= 3).reduce((s,e)=>s+e.duration,0)/60).toFixed(0)} min</div>
                    </div>
                </div>
                <div style="font-size:13px; line-height:1.8; margin-bottom:16px;">
                    <strong>Pairwise Threshold Agreement: ${pairwiseAgreement}%</strong> — when any two reviewers look at the same signal event, they agree on whether it needs trimming ${pairwiseAgreement}% of the time.
                </div>
                <ul style="font-size:13px; line-height:1.8; padding-left:20px; color:#374151; margin-bottom:16px;">
                    <li><strong>${totalEvt} distinct signal events</strong> identified across ${studyIds.length} studies (15s merge tolerance).</li>
                    <li><strong>${(high.length/totalEvt*100).toFixed(0)}% of events</strong> have high agreement (6-7 reviewers) — unambiguous trims.</li>
                    <li><strong>${(moderate.length/totalEvt*100).toFixed(0)}% have moderate agreement</strong> (4-5 reviewers) — majority says trim but notable dissent.</li>
                    <li><strong>${(low.length/totalEvt*100).toFixed(0)}% have low agreement</strong> (2-3 reviewers) — primary calibration targets.</li>
                    <li><strong>${(solo.length/totalEvt*100).toFixed(0)}% are solo flags</strong> — one reviewer's threshold differs from the group.</li>
                </ul>
                <details style="margin-bottom:12px;">
                    <summary style="cursor:pointer; font-size:12px; font-weight:600; color:#374151;">Per-Reviewer Low/Solo Rate</summary>
                    <table style="width:100%; font-size:12px; margin-top:8px; border-collapse:collapse;">
                        <tr style="border-bottom:1px solid #e5e7eb;"><th style="text-align:left;padding:4px;">Reviewer</th><th style="text-align:right;padding:4px;">Events Flagged</th><th style="text-align:right;padding:4px;">In Solo/Low (≤3)</th><th style="text-align:right;padding:4px;">Rate</th></tr>
                        ${reviewerMinority.map(rm => `<tr style="border-bottom:1px solid #f3f4f6;"><td style="padding:4px;">${rm.name}</td><td style="text-align:right;padding:4px;">${rm.total}</td><td style="text-align:right;padding:4px;">${rm.minority}</td><td style="text-align:right;padding:4px;">${rm.rate}%</td></tr>`).join('')}
                    </table>
                </details>
                <details>
                    <summary style="cursor:pointer; font-size:12px; font-weight:600; color:#374151;">Top Calibration Targets (Solo + Low + Moderate events)</summary>
                    <table style="width:100%; font-size:11px; margin-top:8px; border-collapse:collapse;">
                        <tr style="border-bottom:1px solid #e5e7eb;"><th style="text-align:left;padding:4px;">Study</th><th style="text-align:right;padding:4px;">Time</th><th style="text-align:right;padding:4px;">Duration</th><th style="text-align:left;padding:4px 4px 4px 12px;">Flagged By</th><th style="text-align:left;padding:4px;">Not Flagged By</th></tr>
                        ${calibrationTargets.map(e => {
                            const yes = reviewers.filter((r,i) => e.flags[i]).map(r => r.replace('Reviewer ','R')).join(', ');
                            const no = reviewers.filter((r,i) => !e.flags[i]).map(r => r.replace('Reviewer ','R')).join(', ');
                            const fmtT = (s) => Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2,'0');
                            return `<tr style="border-bottom:1px solid #f3f4f6;"><td style="padding:4px;">${e.sid}</td><td style="text-align:right;padding:4px;">${fmtT(e.start)}-${fmtT(e.end)}</td><td style="text-align:right;padding:4px;">${Math.round(e.duration)}s</td><td style="padding:4px 4px 4px 12px;color:#ca8a04;">${yes}</td><td style="padding:4px;color:#6b7280;">${no}</td></tr>`;
                        }).join('')}
                    </table>
                </details>`;
            })()}
        </div>

        <div style="background:#fff; border:1px solid #e5e7eb; border-radius:12px; padding:20px;">
            <h3 style="color:#1f2937; margin-bottom:10px;">Recommendations</h3>
            <ul style="font-size:13px; line-height:1.8; padding-left:20px; color:#374151;">
                <li><strong>Adjudication needed:</strong> The ${zeroIoUStudies} studies with 0% IoU should undergo a consensus review session where reviewers discuss their rationale to establish ground truth.</li>
                <li><strong>High-confidence exclusions:</strong> Studies where all ${reviewers.length} reviewers flagged regions with IoU ≥ 40% can be confidently marked for signal exclusion (${highConfidenceExclude} studies qualify).</li>
                <li><strong>Protocol refinement:</strong> The ${(tolerantIoU * 100 - overallIoU * 100).toFixed(1)} percentage-point gain from ±5s tolerance suggests boundary imprecision is a small factor — disagreements are mostly about <em>whether</em> to flag, not <em>where</em> boundaries are.</li>
                <li><strong>Reviewer calibration:</strong> Consider a calibration session for reviewers with flag rates significantly above/below the ${(avgFlagRate * 100).toFixed(1)}% group mean to align thresholds.</li>
                <li><strong>Dominant failure mode:</strong> "${activeThemes.length > 0 ? activeThemes[0].canonical : 'N/A'}" accounts for the plurality of flags — establishing explicit decision rules for this category could improve future agreement.</li>
            </ul>
        </div>
    </div>`;

    container.innerHTML = html;

    // Store for detail expansion
    window._studyMetrics = studyMetrics;
    window._disagreements = disagreements;
    window._reviewers = reviewers;
}

// ============================================================
// CHART RENDERING (shared by Disagreement Spotlight + Per-Study)
// ============================================================
function renderStudyChart(containerId, sm) {
    const reviewers = window._reviewers;
    const study = STUDIES[sm.sid];
    const startMs = sm.startMs;
    const duration = sm.duration;

    let chartHTML = '';

    // Agreement bar
    let agreementRegions = '';
    let inRegion = false, regionStart = 0;
    for (let i = 0; i <= duration; i++) {
        const allFlagged = i < duration && sm.allBins.every(b => b[i]);
        if (allFlagged && !inRegion) { inRegion = true; regionStart = i; }
        if (!allFlagged && inRegion) {
            inRegion = false;
            const left = (regionStart / duration) * 100;
            const width = ((i - regionStart) / duration) * 100;
            agreementRegions += `<div style="position:absolute;left:${left}%;width:${width}%;height:100%;background:#16a34a;opacity:0.7;border-radius:5px;" title="All agree: ${formatSeconds(regionStart)} — ${formatSeconds(i)}"></div>`;
        }
    }
    chartHTML += `<div style="margin-bottom:8px;">
        <div style="font-size:11px;color:#16a34a;font-weight:600;margin-bottom:3px;">Agreement <span style="font-weight:400;color:#6b7280;">— green = all agree bad signal</span></div>
        <div style="position:relative;height:10px;background:#f3f4f6;border-radius:5px;overflow:hidden;">${agreementRegions}</div>
    </div>`;

    // Plotly chart div
    chartHTML += `<div id="${containerId}_plotly" style="width:100%;height:200px;"></div>`;

    // Per-reviewer bars
    chartHTML += `<div style="margin-top:8px;">
        <div style="font-size:11px;color:#6b7280;font-weight:500;margin-bottom:4px;">Individual Reviewers</div>
        ${reviewers.map((r, ri) => {
            const trims = irrData[r][sm.sid] || [];
            const color = REVIEWER_COLORS[ri % REVIEWER_COLORS.length];
            let bars = '';
            trims.forEach(t => {
                const tStart = Math.max(0, (new Date(t.start).getTime() - startMs) / 1000);
                const tEnd = Math.min(duration, (new Date(t.end).getTime() - startMs) / 1000);
                const left = (tStart / duration) * 100;
                const width = ((tEnd - tStart) / duration) * 100;
                bars += `<div style="position:absolute;left:${left}%;width:${width}%;height:100%;background:${color};opacity:0.6;border-radius:5px;"></div>`;
            });
            return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:3px;">
                <div style="position:relative;flex:1;height:10px;background:#f3f4f6;border-radius:5px;overflow:hidden;">${bars}</div>
                <span style="font-size:10px;font-weight:600;color:${color};width:24px;text-align:right;">${r.replace('Reviewer ', 'R')}</span>
            </div>`;
        }).join('')}
    </div>`;

    // Per-reviewer reasons/notes
    chartHTML += `<div style="margin-top:12px;border-top:1px solid #e5e7eb;padding-top:10px;">
        <div style="font-size:11px;color:#6b7280;font-weight:500;margin-bottom:6px;">Reviewer Notes</div>
        ${reviewers.map((r, ri) => {
            const trims = irrData[r][sm.sid] || [];
            const color = REVIEWER_COLORS[ri % REVIEWER_COLORS.length];
            if (trims.length === 0) return '';
            return trims.map(t => {
                const tStart = Math.max(0, (new Date(t.start).getTime() - startMs) / 1000);
                const tEnd = Math.min(duration, (new Date(t.end).getTime() - startMs) / 1000);
                const fmtTime = (s) => { const m = Math.floor(s/60); const sec = Math.floor(s%60); return m + ':' + String(sec).padStart(2,'0'); };
                const reason = t.reason || 'No reason provided';
                return `<div style="font-size:11px;margin-bottom:4px;padding:4px 8px;background:${color}08;border-left:3px solid ${color};border-radius:0 4px 4px 0;">
                    <span style="font-weight:600;color:${color};">${r.replace('Reviewer ', 'R')}</span>
                    <span style="color:#6b7280;"> ${fmtTime(tStart)}–${fmtTime(tEnd)}</span>
                    <span style="color:#374151;"> — ${reason}</span>
                </div>`;
            }).join('');
        }).join('')}
    </div>`;

    document.getElementById(containerId).innerHTML = chartHTML;

    // Render Plotly chart
    const traces = [];
    // Polar trace
    const polarTs = study.polar.ts.map(t => (new Date(t).getTime() - startMs) / 1000);
    traces.push({ x: polarTs, y: study.polar.hr, type: 'scatter', mode: 'lines', name: 'Polar H10', line: { color: '#1a1a2e', width: 2 }, showlegend: false });

    // WHOOP traces
    if (study.whoop) {
        const whoopKeys = Object.keys(study.whoop);
        whoopKeys.forEach((key, wi) => {
            const wd = study.whoop[key];
            const wTs = wd.ts.map(t => (new Date(t).getTime() - startMs) / 1000);
            traces.push({ x: wTs, y: wd.hr, type: 'scatter', mode: 'lines', name: `WHOOP ${wi + 1}`, line: { color: '#4b5563', width: 1.5, dash: 'dot' }, showlegend: false });
        });
    }

    // Overlay shapes for each reviewer's trims
    const shapes = [];
    reviewers.forEach((r, ri) => {
        const trims = irrData[r][sm.sid] || [];
        const color = REVIEWER_COLORS[ri % REVIEWER_COLORS.length];
        trims.forEach(t => {
            const x0 = Math.max(0, (new Date(t.start).getTime() - startMs) / 1000);
            const x1 = Math.min(duration, (new Date(t.end).getTime() - startMs) / 1000);
            shapes.push({ type: 'rect', xref: 'x', yref: 'paper', x0, x1, y0: 0, y1: 1, fillcolor: color, opacity: 0.07, line: { width: 1.5, color: color } });
        });
    });

    const layout = {
        margin: { t: 10, b: 30, l: 40, r: 10 },
        xaxis: { title: '', showgrid: false, range: [0, duration] },
        yaxis: { title: 'BPM', showgrid: true, gridcolor: '#f3f4f6' },
        shapes: shapes,
        showlegend: false,
        height: 200,
    };

    Plotly.newPlot(`${containerId}_plotly`, traces, layout, { displayModeBar: false, responsive: true });
}

function toggleDisagDetail(di) {
    const row = document.getElementById('disag_detail_' + di);
    const chev = document.getElementById('disag_chev_' + di);
    if (!row) return;
    if (row.style.display === 'none') {
        row.style.display = 'table-row';
        if (chev) chev.style.transform = 'rotate(90deg)';
        const sm = window._disagreements[di];
        renderStudyChart('disag_chart_' + di, sm);
    } else {
        row.style.display = 'none';
        if (chev) chev.style.transform = '';
    }
}

}
